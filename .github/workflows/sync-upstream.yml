name: sync-upstream

on:
  workflow_dispatch:
  schedule:
    - cron: "30 */6 * * *"

permissions:
  contents: write

concurrency:
  group: sync-upstream-master
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: master
          fetch-depth: 0

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Merge upstream/master into master
        run: |
          git remote add upstream "https://github.com/xiaoyaocz/dart_simple_live.git" || \
            git remote set-url upstream "https://github.com/xiaoyaocz/dart_simple_live.git"
          git fetch upstream master
          if ! git merge --no-ff --no-commit -X theirs upstream/master; then
            echo "Merge failed. Manual intervention required."
            git merge --abort || true
            exit 1
          fi
          git restore --source=HEAD --staged --worktree .github/workflows || true
          if git diff --cached --quiet; then
            echo "No upstream changes to commit."
            git merge --abort || true
            exit 0
          fi
          git commit -m "chore: sync upstream/master"

      - name: Push merged changes
        run: |
          if git diff --quiet origin/master HEAD; then
            echo "No upstream changes to push."
            exit 0
          fi
          git push origin HEAD:master
